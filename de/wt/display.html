<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Audio Subtitle view</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #fafafa;
        user-select: none;
      }

      #titleBar {
        background: #fff;
        padding: 15px;
        border-bottom: 1px solid #ddd;
        text-align: center;
      }

      #wordsTableWrap {
        padding: 20px;
      }

      #wordsTable td b {
        line-height: 1.5em;
        font-size: 1.2em;
      }
      #wordsTable td span {
        line-height: 1.5em;
        font-size: 1.1em;
      }

      #wordsTable td {
        padding-right: 4px;
        padding-left: 4px;
      }
      #wordsTable td:first-child {
        color: #ddd;
        vertical-align: middle;
        padding-right: 0px;
      }

      #wordsTable td:last-child {
        color: #000;
        padding-left: 0px;
        font-size: 0.8em;
        vertical-align: middle;
      }
      #titleBar h1 {
        margin: 0;
        font-size: 1.4em;
        font-weight: bold;
      }

      #author {
        font-size: 0.9em;
        color: #666;
        margin-top: 5px;
      }

      #author a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
      }

      #header {
        background: #ffffff;
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ddd;
        flex-wrap: wrap;
      }

      #toggleSpeed {
        font-size: 1em;
        padding: 6px 10px;
        margin-left: 10px;
        flex-shrink: 0;
        cursor: pointer;
      }

      #timeDisplay {
        margin-left: 10px;
        font-size: 0.9em;
        color: #333;
      }

      .subtitle {
        padding: 12px 15px;
        border-bottom: 1px solid #ddd;
        cursor: pointer;
        user-select: none;
      }

      .german {
        font-weight: bold;
        font-size: 1.1em;
      }

      .english {
        margin-top: 3px;
        color: #333;
        margin-top: 0.5em;
        margin-bottom: 0.5em;
      }

      .active {
        background-color: #f0f0f0;
        color: blue;
      }

      .active .german {
        color: #ff0000;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 8px 0px;
        border-bottom: 1px solid #eee;
        vertical-align: top;
      }

      th {
        background-color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="titleBar">
      <h1 id="pageTitle"></h1>
      <div id="author"></div>
    </div>
    <div id="subtitles"></div>

    <div id="wordsTableWrap">
      <table id="wordsTable">
        <tbody></tbody>
      </table>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const dataUrl = params.get("data");

      const subtitleContainer = document.getElementById("subtitles");
      const titleElement = document.getElementById("pageTitle");
      const authorElement = document.getElementById("author");

      let subtitles = [];
      let pressTimer;

      async function loadContent() {
        if (!dataUrl) {
          alert("Missing 'data' or 'audio' URL parameter.");
          return;
        }

        
        const response = await fetch(`${dataUrl}?_=${Date.now()}`);
        const data = await response.json();
        subtitles = data.lines || [];
        
        document.title = titleElement.textContent = data.title;

        if (data.author && data.author_url) {
          authorElement.innerHTML = `<a href="${data.author_url}" target="_blank" rel="noopener noreferrer">${data.author}</a>`;
        }

        renderSubtitles();
      }

      function renderSubtitles() {
        subtitles.forEach((sub, index) => {
          const div = document.createElement("div");
          div.className = "subtitle";
          div.dataset.index = index;

          const germanDiv = document.createElement("div");
          germanDiv.className = "german";
          germanDiv.textContent = sub.de;

          const englishDiv = document.createElement("div");
          englishDiv.className = "english";
          englishDiv.textContent = `${index + 1}. ${sub.en}`;

          div.appendChild(germanDiv);
          div.appendChild(englishDiv);

          div.addEventListener("click", () => handleSubtitleClick(index));

          div.addEventListener("touchstart", () => {
            pressTimer = setTimeout(() => openChatgpt(sub.de), 400);
          });
          div.addEventListener("touchend", () => clearTimeout(pressTimer));
          //div.addEventListener("mousedown", () => {
          //  pressTimer = setTimeout(() => openChatgpt(sub.de), 400);
          //});
          div.addEventListener("mouseup", () => clearTimeout(pressTimer));
          div.addEventListener("mouseleave", () => clearTimeout(pressTimer));

          subtitleContainer.appendChild(div);
        });

        window.addEventListener("scroll", () => clearTimeout(pressTimer));
      }

      function handleSubtitleClick(index) {
        const existingElem = document.querySelector(".subtitle.active");
        if (existingElem) {
          existingElem.classList.remove("active");
        }

        const currentElem = document.querySelector(
          `.subtitle[data-index="${index}"]`
        );
        if (currentElem) {
          currentElem.classList.add("active");
        }

      }
      function openChatgpt(text) {
        const query = `${text}

Show each word in the above German text in the following format. Include the infinitive form of verbs.

<German word in bold font> . <ipa of the word>
<English meaning>`;
        const encoded = encodeURIComponent(query);
        const url = `https://chat.openai.com/?q=${encoded}`;
        window.open(url, "_blank");
      }

      function copyToClipboard(text) {
        const text2 = `${text}

Show each word in the above German text in the following format. Include the infinitive form of verbs.

<German word in bold font> . <ipa of the word>
<English meaning>`;
        navigator.clipboard.writeText(text2);
      }

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, "0")}`;
      }

      loadContent();
    </script>
  </body>
</html>
